        <script>
            function capitalizeTitle(title) {
                return title
                    .toLowerCase()
                    .split(' ')
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
            }

            function answerBoxTemplate(title, titleDesc, prodImgLink, prodLink, prodDesc, simScore, prodId, prodUpvotes, prodDownvotes) {
                const capitalizedTitle = capitalizeTitle(title);
                return `
                <div class="product-card" id="${prodId}">
                    <img src="${prodImgLink}" alt="${capitalizedTitle}" class="product-image" />
                    <div class="product-info">
                        <div class="product-data">
                            <h3 class="clothing-title">${capitalizedTitle}</h3>
                            <p class="clothing-price">$${titleDesc}</p>
                            <p class="clothing-desc">${prodDesc}</p>
                        </div>
                        <div class="product-metadata">
                            <p class="similarity-score">Similarity: ${simScore}</p>
                            <p><em>Does it fit the vibe?</em></p>
                            <div class="voting-buttons">
                                <div class="vote-container">
                                    <button class="upvote" onclick="updateVoteCount(this, 'up')">❤️</button>
                                    <span class="vote-count">${prodUpvotes}</span>
                                </div>
                                <div class="vote-container">
                                    <button class="downvote" onclick="updateVoteCount(this, 'down')">💔</button>
                                    <span class="vote-count">${prodDownvotes}</span>
                                </div>
                            </div>
                        </div>
                    </div>                    
                </div>`;
            }

            function noResults() {
                return `<h3 class="no-results">No results found...What a unique vibe!</h3>`;
            }

            function filterText() {
                document.getElementById("answer-box").innerHTML = "";
                const gender = document.getElementById("gender-dropdown").value;
                const budget = document.getElementById("slider").value;
                const article = document.getElementById("articleType").value;
                const description = document.getElementById("inspirationDesc").value;

                if (!description) {
                    console.log("Description is null or empty:", description);
                } else {
                    console.log("Description value:", description);
                }

                fetch("/articles?" + new URLSearchParams({
                    gender: gender || "",
                    budget: budget || "",
                    article: article || "",
                    inspirationDesc: description || "",
                }).toString())
                    .then((response) => response.json())
                    .then((data) => {
                        const seenItems = new Set();
                        data.slice(0, 8).forEach((row, index) => {
                            if (!seenItems.has(row.prodName)) {
                                seenItems.add(row.prodName);
                                let tempDiv = document.createElement("div");

                                const prodId = row.prodId !== undefined ? row.prodId : index;
                                tempDiv.innerHTML = answerBoxTemplate(
                                    row.prodName,
                                    row.prodPrice,
                                    row.prodImgLink,
                                    row.prodLink,
                                    row.prodDesc,
                                    row.simScore,
                                    row.prodId,
                                    row.prodUpvotes,
                                    row.prodDownvotes
                                );
                                document.getElementById("answer-box").appendChild(tempDiv);
                            }
                        });
                        if (seenItems.size == 0) {
                            let emptyDiv = document.createElement("div");
                            emptyDiv.innerHTML = noResults();
                            document.getElementById("answer-box").appendChild(emptyDiv);
                        }
                    });
            }

            // changed so it uses a true like/dislike system
            function updateVoteCount(button, voteType) {
                const productCard = button.closest('.product-card');
                const voteContainer = button.closest('.vote-container');
                const countSpan = voteContainer.querySelector('.vote-count');

                const oppositeType = voteType === 'up' ? 'down' : 'up';
                const oppositeContainer = productCard.querySelector(`.vote-container:has(.${oppositeType}vote)`);
                const oppositeCountSpan = oppositeContainer.querySelector('.vote-count');

                let count = parseInt(countSpan.textContent);
                let oppositeCount = parseInt(oppositeCountSpan.textContent);

                // check if button active
                if (button.classList.contains('active')) {
                    // REVERSE VOTING
                    button.classList.remove('active');
                    count = 0;
                } else {
                    // user is voting, add active state and set count to 1
                    button.classList.add('active');
                    count = 1;

                    // if opposite button is active, remove its active state and reset its count can't have both active
                    const oppositeButton = oppositeContainer.querySelector('button');
                    if (oppositeButton.classList.contains('active')) {
                        oppositeButton.classList.remove('active');
                        oppositeCount = 0;
                    }
                }

                // update the displayed counts
                countSpan.textContent = count;
                oppositeCountSpan.textContent = oppositeCount;


                countSpan.classList.add('updated');
                setTimeout(() => {
                    countSpan.classList.remove('updated');
                }, 300);

                // product info
                const productId = productCard.id;

                // other info
                const query = document.getElementById('inspirationDesc').value;
                const gender = document.getElementById("gender-dropdown").value;
                const budget = document.getElementById("slider").value;
                const article = document.getElementById("articleType").value;
                // send vote to backend
                fetch('/save_vote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        product_id: productId,
                        vote_type: voteType,
                        vote_value: count, // send 0/1
                        query: query,
                        gender: gender,
                        budget: budget,
                        article: article
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            console.log('Vote saved:', data.message);
                        } else {
                            console.error('Error saving vote:', data.error);
                        }
                    })
                    .catch(error => console.error('Error saving vote:', error));
            }
